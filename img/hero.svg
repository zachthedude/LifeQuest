<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 760" role="img"
     aria-label="An ascending path from level one to level one hundred, passing three glowing waypoints for body, mind and craft.">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="620" y2="760" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#161a30"/>
      <stop offset=".5" stop-color="#0e1122"/>
      <stop offset="1" stop-color="#0a0b14"/>
    </linearGradient>
    <radialGradient id="glow-amber" cx="0" cy="0" r="1"
        gradientTransform="translate(470 120) scale(230)" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffb14c" stop-opacity=".46"/>
      <stop offset="1" stop-color="#ffb14c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-violet" cx="0" cy="0" r="1"
        gradientTransform="translate(120 640) scale(250)" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#a874ff" stop-opacity=".42"/>
      <stop offset="1" stop-color="#a874ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-cyan" cx="0" cy="0" r="1"
        gradientTransform="translate(500 470) scale(210)" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4cc9f0" stop-opacity=".34"/>
      <stop offset="1" stop-color="#4cc9f0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="path-grad" x1="180" y1="700" x2="420" y2="90" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#a874ff"/>
      <stop offset=".45" stop-color="#4cc9f0"/>
      <stop offset="1" stop-color="#ffc65c"/>
    </linearGradient>
    <linearGradient id="crown" x1="270" y1="70" x2="350" y2="150" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffe6a8"/>
      <stop offset="1" stop-color="#ff9d4c"/>
    </linearGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <filter id="node-glow" x="-120%" y="-120%" width="340%" height="340%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="620" height="760" rx="30" fill="url(#sky)"/>
  <rect width="620" height="760" rx="30" fill="url(#glow-amber)"/>
  <rect width="620" height="760" rx="30" fill="url(#glow-violet)"/>
  <rect width="620" height="760" rx="30" fill="url(#glow-cyan)"/>

  <!-- distant stars -->
  <g fill="#ffffff">
    <circle cx="86" cy="96" r="1.6" opacity=".55"/><circle cx="152" cy="196" r="1.1" opacity=".4"/>
    <circle cx="243" cy="72" r="1.3" opacity=".5"/><circle cx="391" cy="176" r="1" opacity=".35"/>
    <circle cx="524" cy="268" r="1.5" opacity=".45"/><circle cx="98" cy="330" r="1.2" opacity=".4"/>
    <circle cx="565" cy="96" r="1.1" opacity=".4"/><circle cx="452" cy="392" r="1.3" opacity=".38"/>
    <circle cx="70" cy="470" r="1.4" opacity=".42"/><circle cx="330" cy="300" r="1" opacity=".3"/>
    <circle cx="546" cy="588" r="1.2" opacity=".36"/><circle cx="196" cy="520" r="1.1" opacity=".34"/>
    <circle cx="404" cy="640" r="1.3" opacity=".38"/><circle cx="288" cy="716" r="1" opacity=".3"/>
  </g>

  <!-- ground haze -->
  <ellipse cx="310" cy="742" rx="250" ry="40" fill="#a874ff" opacity=".16" filter="url(#soft)"/>

  <!-- the climb -->
  <path d="M196 706 C 150 618, 262 578, 236 500 C 214 430, 330 410, 322 336
           C 314 262, 402 246, 388 176 C 380 136, 340 122, 316 112"
        fill="none" stroke="url(#path-grad)" stroke-width="4" stroke-linecap="round"
        stroke-dasharray="1 14" opacity=".85"/>

  <!-- waypoint: body -->
  <g filter="url(#node-glow)">
    <circle cx="236" cy="500" r="27" fill="#0d1020" stroke="#ff8a4c" stroke-width="2.5"/>
    <path d="M240 486 231 501h8l-4 13 13-16h-8l6-12z" fill="#ff8a4c"/>
  </g>
  <text x="278" y="497" font-family="system-ui, sans-serif" font-size="15" font-weight="600"
        fill="#ffd2b0">Body</text>
  <text x="278" y="515" font-family="system-ui, sans-serif" font-size="12" fill="#8e93ad">
    capability, not appearance</text>

  <!-- waypoint: mind -->
  <g filter="url(#node-glow)">
    <circle cx="322" cy="336" r="27" fill="#0d1020" stroke="#4cc9f0" stroke-width="2.5"/>
    <path d="M322 322c-7 0-12 4-12 9 0 3 1 5 3 7-1 5 2 9 7 9h2v-6h-2c-2 0-3-1-3-3l1-3-3-2c-1-1-1-2-1-2 0-2 3-3 8-3s8 1 8 3c0 0 0 1-1 2l-3 2 1 3c0 2-1 3-3 3h-2v6h2c5 0 8-4 7-9 2-2 3-4 3-7 0-5-5-9-12-9z"
          fill="#4cc9f0"/>
  </g>
  <text x="364" y="333" font-family="system-ui, sans-serif" font-size="15" font-weight="600"
        fill="#b6e8fb">Mind</text>
  <text x="364" y="351" font-family="system-ui, sans-serif" font-size="12" fill="#8e93ad">
    understanding you can prove</text>

  <!-- waypoint: craft -->
  <g filter="url(#node-glow)">
    <circle cx="388" cy="176" r="27" fill="#0d1020" stroke="#b57bff" stroke-width="2.5"/>
    <path d="M388 162l4.4 9.4 10.6 1.4-7.8 7.1 2 10.3-9.2-5-9.2 5 2-10.3-7.8-7.1 10.6-1.4z"
          fill="#b57bff"/>
  </g>
  <text x="352" y="172" text-anchor="end" font-family="system-ui, sans-serif" font-size="15"
        font-weight="600" fill="#dcc7ff">Craft</text>
  <text x="352" y="190" text-anchor="end" font-family="system-ui, sans-serif" font-size="12"
        fill="#8e93ad">something that outlives the session</text>

  <!-- summit -->
  <g filter="url(#node-glow)">
    <path d="M310 62 336 100 310 138 284 100Z" fill="url(#crown)"/>
    <path d="M310 78 324 100 310 122 296 100Z" fill="#141726" opacity=".35"/>
  </g>
  <g stroke="#ffc65c" stroke-width="2" stroke-linecap="round" opacity=".75">
    <path d="M310 34v16"/><path d="M256 58l11 10"/><path d="M364 58l-11 10"/>
    <path d="M232 108h14"/><path d="M388 108h-14"/>
  </g>

  <!-- level markers -->
  <g font-family="system-ui, sans-serif" font-weight="700">
    <text x="196" y="736" text-anchor="middle" font-size="15" fill="#6f7590">LV 1</text>
    <text x="310" y="26" text-anchor="middle" font-size="16" fill="#ffc65c">LV 100</text>
  </g>
  <circle cx="196" cy="706" r="9" fill="#2a2f4a" stroke="#6f7590" stroke-width="2"/>
</svg>
