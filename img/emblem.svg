<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="LifeQuest">
  <!--
    The ascent. Three steps rising left to right are the three domains — body,
    mind, and the thing you build — climbing toward the XP star, the only warm
    colour the palette allows.

    Drawn as a silhouette rather than three tinted bars on purpose: at 24px in
    the nav rail the steps have to survive as shape alone, and cut-outs hold
    their edge at that size where tinted bars would blend into the gradient.
    Everything is centred on x=32 so the mark stays balanced when it shrinks.
  -->
  <defs>
    <linearGradient id="e-body" x1="10" y1="4" x2="54" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8fe4ff"/>
      <stop offset=".42" stop-color="#7d8cff"/>
      <stop offset="1" stop-color="#bd85ff"/>
    </linearGradient>
    <linearGradient id="e-sheen" x1="18" y1="8" x2="40" y2="38" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".5"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- The diamond keeps the shape the app already navigates by. -->
  <path d="M32 2 62 32 32 62 2 32Z" fill="url(#e-body)"/>
  <path d="M32 2 62 32 32 62 2 32Z" fill="url(#e-sheen)"/>

  <!-- Three rising steps, cut out of the face, sharing a baseline. -->
  <g fill="#0b0d16" opacity=".85">
    <rect x="15.5" y="40" width="10" height="6" rx="2"/>
    <rect x="27" y="34" width="10" height="12" rx="2"/>
    <rect x="38.5" y="28" width="10" height="18" rx="2"/>
  </g>

  <!-- XP: the one warm mark in the whole palette, and what the steps climb to. -->
  <path d="M32 7.5 33.84 13.16 39.5 15 33.84 16.84 32 22.5 30.16 16.84 24.5 15 30.16 13.16Z"
        fill="#ffcf5c"/>
</svg>
